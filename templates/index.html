<!DOCTYPE html>
<html>
<head>
  <title>Chat Application</title>

  <link
    rel="stylesheet"
    href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
  >
  <link
    rel="stylesheet"
    href="{{ url_for('static', path='/css/styles.css') }}"
  >
</head>

<body>
  <div class="container">

    <h3 class="text-center mb-4">Chat Application</h3>

    <!-- LOGIN SECTION -->
    <div id="auth-section">
      <input
        type="text"
        id="login-username"
        class="form-control mb-2"
        placeholder="Username"
      >
      <input
        type="password"
        id="login-password"
        class="form-control mb-3"
        placeholder="Password"
      >
      <button id="login-btn" class="btn btn-primary btn-block">
        Login
      </button>
    </div>

    <!-- ROOM SECTION -->
    <div id="room-section" style="display:none;">
      <input
        type="text"
        id="room-name"
        class="form-control mb-2"
        placeholder="Enter Room Name"
      >
      <button id="join-room" class="btn btn-success btn-block">
        Join Room
      </button>
    </div>


  </div>

  <script src="https://code.jquery.com/jquery-3.2.1.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
  <script src="{{ url_for('static', path='/js/scripts.js') }}"></script>
</body>
</html>
